workflows:
  ios-build:
    name: Build Nyxian IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          pod install --repo-update || true
      - name: Build Xcode Project
        script: |
          xcodebuild build -project Nyxian.xcodeproj -scheme Nyxian -configuration Release CODE_SIGNING_ALLOWED=NO
      - name: Package Unsigned IPA
        script: |
          mkdir -p build/Payload
          # Находим скомпилированное приложение и копируем в Payload
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "Nyxian.app" -type d | head -n 1)
          cp -r "$APP_PATH" build/Payload/
          # Упаковываем в zip, меняя расширение на .ipa
          cd build && zip -r Nyxian_unsigned.ipa Payload
    artifacts:
      - build/*.ipa


