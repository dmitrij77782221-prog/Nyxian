workflows:
  ios-build:
    name: Build Nyxian IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          pod install --repo-update || true
      - name: Build Xcode Project
        script: |
          xcodebuild build -project Nyxian.xcodeproj -scheme Nyxian -configuration Release CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app

